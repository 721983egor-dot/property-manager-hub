services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      - DOMAIN=${DOMAIN}
      - TLS_EMAIL=${TLS_EMAIL}
      - PREVIEW_USER=${PREVIEW_USER:-preview}
      - PREVIEW_PASSWORD_HASH=${PREVIEW_PASSWORD_HASH:-$$2y$$05$$j4UNi.r1VeA69TkNtGvl4OviK0bwhmnVUrV.vpPWH1LCcG9Nle1OK}
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile", "--watch"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - rm-os

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VITE_SUPABASE_URL: ${PUBLIC_BASE_URL:-https://${DOMAIN}}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_PROJECT_ID: ${SUPABASE_PROJECT_ID}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Внутренний адрес: контейнер обращается к своим сервисам напрямую,
      # не выходя в интернет через домен.
      - SUPABASE_URL=http://caddy
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_PROJECT_ID=${SUPABASE_PROJECT_ID}
      - CIAN_API_KEY=${CIAN_API_KEY}
      - YANDEX_REALTY_TOKEN=${YANDEX_REALTY_TOKEN}
      - YANDEX_GEOCODER_API_KEY=${YANDEX_GEOCODER_API_KEY}
      - YANDEX_MAPS_JS_API_KEY=${YANDEX_MAPS_JS_API_KEY}
      - YANDEX_SUGGEST_API_KEY=${YANDEX_SUGGEST_API_KEY}
      - LOVABLE_CRON_SECRET=${LOVABLE_CRON_SECRET}
      - LOVABLE_API_KEY=${LOVABLE_API_KEY}
      - TELEGRAM_API_KEY=${TELEGRAM_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-${TELEGRAM_API_KEY}}
      - CIAN_API_KEY=${CIAN_API_KEY:-}
      - YANDEX_REALTY_TOKEN=${YANDEX_REALTY_TOKEN:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - PUBLIC_SITE_URL=https://${DOMAIN}
      - PUBLIC_BASE_URL=https://${DOMAIN}
      - RM_OS_URL=https://rm-os.${DOMAIN}
      - DEPLOY_AGENT_URL=http://deploy-agent:8080
      - DEPLOY_AGENT_TOKEN=${DEPLOY_AGENT_TOKEN}
    volumes:
      - runtime_secrets:/data/runtime-secrets
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-auth:
        condition: service_started
      supabase-rest:
        condition: service_started
      supabase-storage:
        condition: service_started
    networks:
      - rm-os

  # Тестовая копия приложения. Собирается из ветки preview, рабочий контейнер app не перезапускает.
  preview-app:
    profiles:
      - preview
    build:
      context: ${PREVIEW_REPO_DIR:-/opt/rm-os/preview}
      dockerfile: deploy/Dockerfile
      args:
        VITE_SUPABASE_URL: https://preview.${DOMAIN}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_PROJECT_ID: ${SUPABASE_PROJECT_ID}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - PREVIEW_MODE=1
      - SUPABASE_URL=http://caddy
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_PROJECT_ID=${SUPABASE_PROJECT_ID}
      - CIAN_API_KEY=${CIAN_API_KEY}
      - YANDEX_REALTY_TOKEN=${YANDEX_REALTY_TOKEN}
      - YANDEX_GEOCODER_API_KEY=${YANDEX_GEOCODER_API_KEY}
      - YANDEX_MAPS_JS_API_KEY=${YANDEX_MAPS_JS_API_KEY}
      - YANDEX_SUGGEST_API_KEY=${YANDEX_SUGGEST_API_KEY}
      - LOVABLE_CRON_SECRET=${LOVABLE_CRON_SECRET}
      - LOVABLE_API_KEY=${LOVABLE_API_KEY}
      - TELEGRAM_API_KEY=${TELEGRAM_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-${TELEGRAM_API_KEY}}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - PUBLIC_SITE_URL=https://preview.${DOMAIN}
      - PUBLIC_BASE_URL=https://preview.${DOMAIN}
      - RM_OS_URL=https://preview-rm-os.${DOMAIN}
      - DEPLOY_AGENT_URL=http://deploy-agent:8080
      - DEPLOY_AGENT_TOKEN=${DEPLOY_AGENT_TOKEN}
    volumes:
      - runtime_secrets:/data/runtime-secrets
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-auth:
        condition: service_started
      supabase-rest:
        condition: service_started
      supabase-storage:
        condition: service_started
    networks:
      - rm-os

  migrator:
    image: postgres:15-alpine
    restart: "no"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    entrypoint: ["/bin/sh", "/apply-migrations.sh"]
    volumes:
      - ./apply-migrations.sh:/apply-migrations.sh:ro
      - ../supabase/migrations:/migrations:ro
    depends_on:
      supabase-db:
        condition: service_healthy
    networks:
      - rm-os

  supabase-db:
    image: supabase/postgres:15.1.1.78
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/z-99-roles.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - rm-os

  supabase-auth:
    image: supabase/gotrue:v2.158.1
    restart: unless-stopped
    environment:
      - GOTRUE_API_HOST=0.0.0.0
      - GOTRUE_API_PORT=9999
      - API_EXTERNAL_URL=https://${DOMAIN}/auth
      - GOTRUE_DB_DRIVER=postgres
      - GOTRUE_DB_DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@supabase-db:5432/postgres?search_path=auth
      - GOTRUE_JWT_SECRET=${JWT_SECRET}
      - GOTRUE_JWT_AUD=authenticated
      # Access JWT на сутки; refresh без ротации — иначе параллельные вкладки/iPhone выбивают из входа.
      - GOTRUE_JWT_EXP=86400
      - GOTRUE_REFRESH_TOKEN_ROTATION_ENABLED=false
      - GOTRUE_REFRESH_TOKEN_REUSE_INTERVAL=86400
      - GOTRUE_EXTERNAL_EMAIL_ENABLED=true
      - GOTRUE_MAILER_AUTOCONFIRM=true
      - GOTRUE_DISABLE_SIGNUP=true
      - GOTRUE_SITE_URL=https://rm-os.${DOMAIN}
      - GOTRUE_URI_ALLOW_LIST=https://${DOMAIN},https://www.${DOMAIN},https://rm-os.${DOMAIN},https://preview.${DOMAIN},https://preview-rm-os.${DOMAIN}
    depends_on:
      supabase-db:
        condition: service_healthy
    networks:
      - rm-os

  supabase-rest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    environment:
      - PGRST_DB_URI=postgres://authenticator:${POSTGRES_PASSWORD}@supabase-db:5432/postgres
      - PGRST_DB_SCHEMAS=public,storage
      - PGRST_DB_ANON_ROLE=anon
      - PGRST_JWT_SECRET=${JWT_SECRET}
    depends_on:
      supabase-db:
        condition: service_healthy
    networks:
      - rm-os

  supabase-storage:
    image: supabase/storage-api:v1.22.17
    restart: unless-stopped
    environment:
      - ANON_KEY=${SUPABASE_PUBLISHABLE_KEY}
      - SERVICE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - AUTH_JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@supabase-db:5432/postgres
      - DB_DRIVER=postgres
      - FILE_SIZE_LIMIT=52428800
      - STORAGE_BACKEND=file
      - FILE_STORAGE_BACKEND_PATH=/var/lib/storage
      - TENANT_ID=rm-os
      - REGION=local
      - GLOBAL_S3_BUCKET=stub
      - ENABLE_IMAGE_TRANSFORMATION=false
      - IS_MULTITENANT=false
      - POSTGREST_URL=http://supabase-rest:3000
    volumes:
      - storage_data:/var/lib/storage
    depends_on:
      supabase-db:
        condition: service_healthy
    networks:
      - rm-os

  deploy-agent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.agent
    restart: unless-stopped
    environment:
      - DEPLOY_AGENT_TOKEN=${DEPLOY_AGENT_TOKEN}
      - GITHUB_REPO=${GITHUB_REPO}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - DOMAIN=${DOMAIN}
      - APP_IMAGE=rm-os-app
      - PREVIEW_DIR=/opt/rm-os/preview
      - PREVIEW_BRANCH=preview
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - LOVABLE_API_KEY=${LOVABLE_API_KEY}
      - TELEGRAM_API_KEY=${TELEGRAM_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-${TELEGRAM_API_KEY}}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - deploy_data:/data
      - /opt/rm-os/repo:/data/repo
      - /opt/rm-os/preview:/opt/rm-os/preview
      - /opt/rm-os/backups:/data/backups
      # Живой скрипт с диска — после git pull достаточно restart, без опасной пересборки себя
      - /opt/rm-os/repo/deploy/deploy-agent.py:/agent/deploy-agent.py:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/docs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - rm-os

  # Регулярное обновление статистики и чатов площадок на рабочем сервере.
  stats-cron:
    image: alpine:3.20
    restart: unless-stopped
    environment:
      - CRON_SECRET=${LOVABLE_CRON_SECRET:-}
      - DEPLOY_AGENT_TOKEN=${DEPLOY_AGENT_TOKEN}
    command:
      - sh
      - -c
      - |
        apk add --no-cache curl >/dev/null
        while true; do
          SECRET="$${CRON_SECRET:-$$DEPLOY_AGENT_TOKEN}"
          curl -fsS -X POST http://app:3000/api/public/cron/cian-sync \
            -H "x-cron-secret: $$SECRET" || true
          sleep 900
        done
    depends_on:
      - app
    networks:
      - rm-os

  # Telegram не достучаться входящим HTTPS до Бегета — бот сам забирает сообщения.
  telegram-poller:
    image: python:3.12-alpine
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-${TELEGRAM_API_KEY}}
      - TELEGRAM_FORWARD_URL=http://app:3000/api/public/telegram/webhook
    volumes:
      - ./telegram-poller.py:/poller.py:ro
    command: ["python", "/poller.py"]
    depends_on:
      - app
    networks:
      - rm-os

  # Клиентские боты Telegram и MAX → раздел «Чаты» RM OS.
  messenger-poller:
    image: alpine:3.20
    restart: unless-stopped
    environment:
      - CRON_SECRET=${LOVABLE_CRON_SECRET:-}
      - DEPLOY_AGENT_TOKEN=${DEPLOY_AGENT_TOKEN}
    command:
      - sh
      - -c
      - |
        apk add --no-cache curl >/dev/null
        while true; do
          SECRET="$${CRON_SECRET:-$$DEPLOY_AGENT_TOKEN}"
          curl -fsS -X POST http://app:3000/api/public/cron/messenger-poll \
            -H "x-cron-secret: $$SECRET" || true
          sleep 5
        done
    depends_on:
      - app
    networks:
      - rm-os

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  storage_data:
  deploy_data:
  runtime_secrets:

networks:
  rm-os:
    driver: bridge
