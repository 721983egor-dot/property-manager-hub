# Install only after issuing a valid certificate for the preview domain.
# Keep the independent status-page vhost unchanged.
map $http_authorization $rmos_preview_realm {
    default "RM OS Preview";
    "~^Bearer " off;
}
server {
    listen 80;
    listen [::]:80;
    server_name preview-rm-os.residence-more.ru;
    location ^~ /.well-known/acme-challenge/ { root /var/www/rm-status/dist; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name preview-rm-os.residence-more.ru;
    ssl_certificate /etc/letsencrypt/live/preview-rm-os.residence-more.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preview-rm-os.residence-more.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 100m;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "same-origin" always;
    auth_basic $rmos_preview_realm;
    auth_basic_user_file /etc/nginx/rmos-preview.htpasswd;
    location = /robots.txt { auth_basic off; return 200 "User-agent: *\nDisallow: /\n"; }
    # Supabase uses Bearer authorization. Real staff data remains behind RLS.
    # This isolated database contains only fictional demonstration records.
    location ~ ^/(auth|rest|storage)/v1/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:54321;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = / { return 302 /objects; }
    location / {
        proxy_pass http://127.0.0.1:64194;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
    }
}
